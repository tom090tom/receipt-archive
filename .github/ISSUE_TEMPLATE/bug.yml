name: 识别或归档问题
description: 合成发票的识别、命名或复制不符合预期
body:
  - type: textarea
    attributes:
      label: 发生了什么
      description: 不要粘贴真实发票、税号、金额或客户名称。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: input
    attributes:
      label: 版本与环境
      placeholder: 0.1.0 / Windows / Node 24 / 浏览器
